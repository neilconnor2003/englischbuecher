name: 🧪 Test after deploy

on:
  push:
    branches: [main]  # runs every time you merge to main

jobs:
  playwright-crawl:
    name: Full site crawl
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: Wait for Netlify deploy to go live
        run: sleep 60

      - name: Run full site crawl
        run: npx playwright test 07-full-crawl --reporter=list
        working-directory: frontend
        env:
          TEST_URL: https://englischbuecher.de

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/tests/playwright-report/
          retention-days: 7
